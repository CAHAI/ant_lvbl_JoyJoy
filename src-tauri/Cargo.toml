[package]
name = "joy-joy-os"
version = "0.1.0"
description = "Joy-Joy OS — Portable mental hygiene presentation terminal"
authors = ["CAHAI"]
edition = "2021"

[lib]
name = "joy_joy_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
